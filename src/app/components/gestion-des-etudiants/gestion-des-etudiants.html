<div class="gestion-container">
  <h2>Gestion des Étudiants</h2>

  <form #gestionForm="ngForm" (ngSubmit)="sauvegarder(gestionForm)">
    <div class="form-field">
      <label for="nomUtilisateur">Nom</label>
      <input id="nomUtilisateur" name="nomUtilisateur" type="text" [(ngModel)]="etudiant.nomUtilisateur" required minlength="5" />
      <small>Obligatoire, minimum 5 caractères.</small>
    </div>

    <div class="form-field">
      <label for="prenom">Prénom</label>
      <input id="prenom" name="prenom" type="text" [(ngModel)]="etudiant.prenom" required maxlength="10" />
      <small>Obligatoire, maximum 10 caractères.</small>
    </div>

    <div class="form-field">
      <label for="dateNaissance">Date de naissance</label>
      <input id="dateNaissance" name="dateNaissance" type="date" [(ngModel)]="etudiant.dateNaissance" required />
    </div>

    <div class="form-field">
      <label for="email">Adresse mail</label>
      <input id="email" name="email" type="email" [(ngModel)]="etudiant.email" required />
    </div>

    <div class="form-field">
      <label for="telephone">Téléphone</label>
      <input id="telephone" name="telephone" type="tel" [(ngModel)]="etudiant.telephone" required />
    </div>

    <div class="button-row">
      <button type="submit" class="btn btn-save">Sauvegarder</button>
      <button type="button" class="btn btn-cancel" (click)="annuler(gestionForm)">Annuler</button>
      <button type="button" class="btn btn-list" (click)="lister()">Lister</button>
    </div>
  </form>
</div>
