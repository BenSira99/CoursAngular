<section class="interpolation-container">
  <h1 class="demo-title">
    Interpolation et Data Binding (Chapitre 3)
  </h1>

  <div class="demo-section">
    
    <h2 class="section-title">Affichage de données</h2>

    <!-- EXEMPLE 1 : Objet -->
    <div style="margin-bottom: 2rem;">
      <h3 style="color: #64748b; font-size: 1rem; margin-bottom: 0.75rem;">Exemple 1 : Affichage d'un objet</h3>
      <ul class="data-list">
        <li class="data-item">
          <span class="data-label">Nom :</span> {{ etudiant.nom }}
        </li>
        <li class="data-item">
          <span class="data-label">Prénom :</span> {{ etudiant.prenom }}
        </li>
      </ul>
      
      <div class="raw-data-box">
        <p class="raw-data-text">
          <strong>Objet brut :</strong> <code>{{ etudiant }}</code>
        </p>
      </div>

      <p style="margin-top: 1.5rem; font-weight: 600; font-size: 0.9rem; color: #475569;">Format JSON (Pipe JSON) :</p>
      <pre class="json-pre">{{ etudiant | json }}</pre>
    </div>

    <hr style="margin: 2rem 0; border: 0; border-top: 1px solid #f1f5f9;">

    <!-- EXEMPLE 3 : Méthode -->
    <div>
      <h3 style="color: #64748b; font-size: 1rem; margin-bottom: 0.75rem;">Exemple 3 : Appel de méthode</h3>
      <p class="method-response">
         ✨ {{ direBonjour() }}
      </p>
    </div>
  </div>
</section>
