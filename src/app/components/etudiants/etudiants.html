<div class="gestion-container">
  <div class="form-card">
    <h2>Inscription Simplifiée</h2>
    <p class="subtitle">Template Driven Form (Chapitre 6)</p>

    <form #formUser="ngForm" class="modern-form">
      
      <!-- NOM UTILISATEUR -->
      <div class="form-group">
        <label>Nom d'utilisateur</label>
        <input type="text" 
               name="username" 
               [(ngModel)]="utilisateur.nomUtilisateur" 
               #username="ngModel" 
               required 
               minlength="3" 
               placeholder="Entrez votre pseudo">
        <div class="error" *ngIf="username.invalid && username.touched">
          Le nom d'utilisateur est requis (min. 3 caractères).
        </div>
      </div>

      <!-- EMAIL -->
      <div class="form-group">
        <label>Adresse Mail</label>
        <input type="email" 
               name="email" 
               [(ngModel)]="utilisateur.email" 
               #emailRef="ngModel" 
               required 
               email 
               placeholder="exemple@mail.com">
        <div class="error" *ngIf="emailRef.invalid && emailRef.touched">
          Un email valide est requis.
        </div>
      </div>

      <!-- MOT DE PASSE -->
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" 
               name="password" 
               [(ngModel)]="utilisateur.motDePasse" 
               #password="ngModel" 
               required 
               minlength="6" 
               placeholder="6 caractères minimum">
        <div class="error" *ngIf="password.invalid && password.touched">
          Le mot de passe est requis (min. 6 caractères).
        </div>
      </div>

      <!-- BOUTONS -->
      <div class="actions">
        <button type="button" 
                class="btn btn-save" 
                (click)="sauvegarder()" 
                [disabled]="formUser.invalid">
          Sauvegarder
        </button>
        <button type="button" 
                class="btn btn-cancel" 
                (click)="annuler()">
          Annuler
        </button>
        <button type="button" 
                class="btn btn-list" 
                (click)="lister()">
          Lister
        </button>
      </div>

    </form>
  </div>
</div>
